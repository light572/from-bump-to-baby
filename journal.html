<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mama Journal | From Bump to Baby</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');:root{--sage:#879486;--deep:#33423a;--cream:#faf7f0;--gold:#c49a61;--ink:#27332d;--muted:#69736d;--rose:#d8aaa0}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.65 'DM Sans',sans-serif}a{text-decoration:none;color:inherit}.nav{height:76px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;background:#faf7f0f2;border-bottom:1px solid #e5dfd3;position:sticky;top:0;z-index:5}.brand{font:18px 'Playfair Display';color:var(--deep);display:flex;gap:9px;align-items:center}.brand small{display:block;font:10px 'DM Sans';letter-spacing:1px;color:var(--muted)}nav{display:flex;gap:22px;align-items:center;font-size:14px}.cta{background:var(--deep);color:#fff;padding:9px 15px;border-radius:30px}.hero{min-height:650px;padding:90px 8%;display:grid;grid-template-columns:1.2fr .8fr;gap:55px;align-items:center;background:linear-gradient(135deg,#faf7f0,#edf1ec)}.eyebrow{font-size:11px;letter-spacing:2.4px;font-weight:700;color:var(--sage)}.danger{color:#9b5b55}.hero h1,h1,h2{font-family:'Playfair Display';font-weight:500;line-height:1.12}.hero h1{font-size:62px;margin:18px 0}.hero h1 em{color:var(--sage)}.hero p{max-width:620px;color:var(--muted);font-size:17px}.btn{display:inline-block;padding:13px 22px;border-radius:30px;font-weight:700;border:1px solid #cdd4ce;margin:6px}.primary{background:var(--deep);color:white;border-color:var(--deep)}.hero-card{background:#fff;border:1px solid #e5dfd3;border-radius:28px;padding:40px;text-align:center;box-shadow:0 18px 50px #33423a12}.star{font-size:40px;color:var(--gold)}.baby{font:110px 'Playfair Display';color:var(--rose)}.section,.page{padding:85px 8%}.section h2,.page h1{font-size:44px;margin:12px 0 35px}.soft{background:#edf1ec}.grid{display:grid;gap:18px}.four{grid-template-columns:repeat(4,1fr)}.three{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:repeat(2,1fr)}.card{background:#fff;padding:28px;border:1px solid #e5dfd3;border-radius:20px}.card>b{font-size:32px}.card p{color:var(--muted)}.card a{font-weight:700}.emergency{padding:35px 8%;background:var(--deep);color:white;display:flex;align-items:center;justify-content:space-between;gap:30px}.emergency p{color:#dfe6e1;max-width:780px}.light{background:white;color:var(--deep)}.center{text-align:center}.center p{color:var(--muted);max-width:650px;margin:0 auto 25px}.page{max-width:1100px;margin:auto}.lead{font-size:20px;color:var(--muted);max-width:700px}.content{display:grid;grid-template-columns:1fr 310px;gap:45px}.content li{margin:9px 0}.tip{background:#edf1ec;border-left:4px solid var(--sage);padding:25px;border-radius:8px;margin-top:30px}.warning{background:white;border-left:5px solid var(--rose);padding:20px;border-radius:10px;font-weight:600}.form{max-width:720px;background:#fff;border:1px solid #e5dfd3;border-radius:20px;padding:30px}.form label{display:block;font-weight:700;margin:18px 0}.form input,.form textarea{display:block;width:100%;padding:13px;margin-top:7px;border:1px solid #d9ddd8;border-radius:10px;font:inherit}.form textarea{min-height:130px}#saved{color:var(--sage);font-weight:700}.book{display:grid;grid-template-columns:300px 1fr;gap:60px;align-items:center}.cover{height:430px;background:linear-gradient(145deg,#dfe6de,#aab7aa);border-radius:8px;padding:35px;text-align:center;font:25px 'Playfair Display';display:flex;flex-direction:column;justify-content:center;box-shadow:12px 15px 0 #d6c7b5}.cover strong{font-size:43px;line-height:.9}.cover small{font:10px 'DM Sans';letter-spacing:2px;margin-top:25px}footer{padding:28px 8%;background:#25332c;color:#dfe7e1;display:flex;justify-content:space-between;font-size:12px}@media(max-width:850px){nav{display:none}.hero{grid-template-columns:1fr;padding:65px 7%}.hero h1{font-size:45px}.four,.three{grid-template-columns:1fr 1fr}.content,.book{grid-template-columns:1fr}.cover{margin:auto;width:280px}.emergency{display:block}}@media(max-width:520px){.four,.three,.two{grid-template-columns:1fr}.section,.page{padding:60px 6%}.hero h1{font-size:39px}.btn{width:100%;text-align:center}footer{display:block}.hero-card{padding:28px}}</style></head><body><header class="nav"><a class="brand" href="index.html">✦ <span>From Bump to Baby<small>by Kerubo Nyakundi</small></span></a><nav><a href="index.html">Home</a><a href="checklists.html">Checklists</a></nav></header><main class="page"><span class="eyebrow">MY JOURNAL</span><h1>Mama Journal</h1><p class="lead">Prepare your questions and keep useful notes for professional visits.</p><div class="form"><label>Name<input id="name" placeholder="Your name"></label><label>Due date / baby's date of birth<input id="date" type="date"></label><label>Questions<textarea id="questions" placeholder="Questions for your next visit..."></textarea></label><label>Notes<textarea id="notes" placeholder="Important notes..."></textarea></label><button class="btn primary" onclick="saveJournal()">Save on this device</button> <span id="saved"></span></div></main><footer>Private notes stay in this browser in this demo version.</footer><script>function saveJournal(){const d={name:document.querySelector('#name').value,date:document.querySelector('#date').value,questions:document.querySelector('#questions').value,notes:document.querySelector('#notes').value};localStorage.setItem('bumpToBabyJournal',JSON.stringify(d));document.querySelector('#saved').textContent=' Saved ✓'}document.addEventListener('DOMContentLoaded',()=>{try{const d=JSON.parse(localStorage.getItem('bumpToBabyJournal')||'{}');['name','date','questions','notes'].forEach(k=>{if(document.querySelector('#'+k))document.querySelector('#'+k).value=d[k]||''})}catch(e){}});</script></body></html>
